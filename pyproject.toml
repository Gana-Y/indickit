[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "indickit"
version = "0.1.0"
description = "Zero-dependency toolkit for Indian-language text (script detection, normalisation, transliteration, token-tax stats) plus a rule-based LLM benchmark for 10 Indian languages."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ganesh Yandigeri", email = "ganeshyandigeri1@gmail.com" }]
keywords = ["indic", "nlp", "hindi", "kannada", "tamil", "telugu", "malayalam", "transliteration", "benchmark", "llm", "tokenizer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
tokenizers = ["tiktoken", "tokenizers"]
dev = ["pytest>=7", "ruff"]

[project.urls]
Homepage = "https://github.com/Gana-Y/indickit"
Issues = "https://github.com/Gana-Y/indickit/issues"

[project.scripts]
indickit = "indickit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
